<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration sécurisée — ProxiHome</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-login-body">
    <div class="booking-card" style="max-width: 420px; width: 90%;">
        <div class="text-center" style="margin-bottom: 1.5rem;">
            <span style="font-size: 2.5rem;">🔒</span>
            <h2>Espace Administrateur</h2>
            <p class="muted-text">ProxiHome Wasquehal — Accès restreint</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="error-banner" style="margin-bottom: 1rem;">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Identifiant</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>
    </div>
</body>
</html>
